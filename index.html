<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yes or No Wheel</title>
  <style>
    :root {
      --bg: #1b1730;
      --text: #f5f1ff;
      --muted: #a79fc4;
      --yellow: #ffc700;
      --red: #e5322d;
      --rim: #2c2650;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.02em;
    }

    p.sub { margin: 0; color: var(--muted); }

    .stage {
      position: relative;
      width: min(88vw, 460px);
      aspect-ratio: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      border-radius: 50%;
      box-shadow: 0 0 0 10px var(--rim), 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Pointer at the top */
    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 36px solid var(--text);
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }

    button {
      font: inherit;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 14px 40px;
      border: none;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:hover:not(:disabled) { transform: scale(1.04); }
    button:focus-visible, canvas:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #result {
      min-height: 3.2rem;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: bold;
      transition: color 0.2s;
    }
    #result.yes { color: var(--yellow); }
    #result.no  { color: var(--red); }
  </style>
</head>
<body>
  <h1>Yes or No?</h1>
  <p class="sub">Ask a question, then spin the wheel.</p>

  <div class="stage">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600" tabindex="0" aria-label="Yes or no wheel"></canvas>
  </div>

  <button id="spinBtn">Spin</button>
  <div id="result" aria-live="polite"></div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const resultEl = document.getElementById("result");

    const SEGMENTS = 8; // even index = YES (yellow), odd index = NO (red)
    const SLICE = (Math.PI * 2) / SEGMENTS;
    const COLORS = { yes: "#ffc700", no: "#e5322d" };
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let rotation = 0;      // current wheel rotation in radians
    let spinning = false;

    function drawWheel() {
      const size = canvas.width;
      const c = size / 2;
      const r = c - 4;

      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(rotation);

      for (let i = 0; i < SEGMENTS; i++) {
        const isYes = i % 2 === 0;
        const start = i * SLICE;
        const end = start + SLICE;

        // Slice
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, start, end);
        ctx.closePath();
        ctx.fillStyle = isYes ? COLORS.yes : COLORS.no;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#1b1730";
        ctx.stroke();

        // Label
        ctx.save();
        ctx.rotate(start + SLICE / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.font = "bold 44px 'Trebuchet MS', sans-serif";
        ctx.fillStyle = isYes ? "#1b1730" : "#ffffff";
        ctx.fillText(isYes ? "YES" : "NO", r - 28, 0);
        ctx.restore();
      }

      // Hub
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.fillStyle = "#f5f1ff";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#1b1730";
      ctx.stroke();

      ctx.restore();
    }

    function getResult() {
      // Pointer sits at the top (-90°). Find which slice is under it.
      const TWO_PI = Math.PI * 2;
      const pointerAngle = ((-Math.PI / 2 - rotation) % TWO_PI + TWO_PI) % TWO_PI;
      const index = Math.floor(pointerAngle / SLICE);
      return index % 2 === 0 ? "yes" : "no";
    }

    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      resultEl.textContent = "";
      resultEl.className = "";

      const startRotation = rotation;
      const extra = (5 + Math.random() * 4) * Math.PI * 2; // 5–9 full turns, random stop
      const duration = reducedMotion ? 600 : 4500;
      const startTime = performance.now();

      function frame(now) {
        const t = Math.min((now - startTime) / duration, 1);
        rotation = startRotation + extra * easeOutCubic(t);
        drawWheel();

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          spinning = false;
          spinBtn.disabled = false;
          const answer = getResult();
          resultEl.textContent = answer.toUpperCase() + "!";
          resultEl.className = answer;
        }
      }
      requestAnimationFrame(frame);
    }

    spinBtn.addEventListener("click", spin);
    canvas.addEventListener("click", spin);
    canvas.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); spin(); }
    });

    drawWheel();
  </script>
</body>
</html>
